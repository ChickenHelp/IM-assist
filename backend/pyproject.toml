[project]
name = "pitwall-backend"
version = "0.1.0"
description = "PitWall — iRacing Race Engineer Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "aiosqlite>=0.19.0",
    "reportlab>=4.1.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
iracing = [
    "pyirsdk>=1.3.0",
]
analysis = [
    "matplotlib>=3.8.0",
    "scikit-learn>=1.4.0",
]
webrtc = [
    "aiortc>=1.9.0",
]
discovery = [
    "zeroconf>=0.131.0",
    "msgpack>=1.0.7",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
